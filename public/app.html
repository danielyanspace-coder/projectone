<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nova Scout — экосистема ИИ-проектов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--blue:#298DFF;--blue-l:#5aa6ff;--ink:#0b0c0f;--ink2:#101216;--card:#0d0f13;--hair:rgba(255,255,255,.09);--hairlit:rgba(255,255,255,.18);
--sans:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{background:#060708;color:#e9ebef;font-family:var(--sans);overflow-x:hidden;line-height:1.55}
::selection{background:var(--blue);color:#fff}
a{color:inherit;text-decoration:none}
canvas,img,svg{display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:rgba(255,255,255,.42)}
.disp{font-family:var(--disp);letter-spacing:-.02em}
.serif{font-family:var(--serif)}
.cursor-glow{position:fixed;width:480px;height:480px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(41,141,255,.08),transparent 60%);transform:translate(-50%,-50%);transition:opacity .4s;opacity:0;mix-blend-mode:screen}
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:.3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(6,7,8,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:#fff;letter-spacing:-.01em}
.logo .mark{width:28px;height:28px;overflow:visible}
.logo .dim{color:rgba(255,255,255,.5)}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:8px 13px;border-radius:8px;font-size:14px;color:rgba(255,255,255,.6);transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.05)}
.nav-cta{display:flex;align-items:center;gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:transform .15s,background .2s,border-color .2s;position:relative;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-l)}
.btn-ghost{background:transparent;color:#fff;border:1px solid var(--hairlit)}
.btn-ghost:hover{background:rgba(255,255,255,.06)}
.btn-white{background:#fff;color:#000}.btn-white:hover{background:rgba(255,255,255,.9)}
.btn-danger{background:transparent;border:1px solid rgba(248,113,113,.35);color:#fca5a5}.btn-danger:hover{background:rgba(248,113,113,.12)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:7px}
.link-dim{font-size:14px;color:rgba(255,255,255,.6);transition:.2s;cursor:pointer}.link-dim:hover{color:#fff}
.burger{display:none;width:40px;height:40px;border:1px solid var(--hair);border-radius:9px;background:none;cursor:pointer;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:2px;background:#fff;transition:.25s}
.mobile-menu{position:fixed;inset:62px 0 auto 0;z-index:49;background:rgba(6,7,8,.98);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);transform:translateY(-130%);transition:transform .35s cubic-bezier(.16,1,.3,1);padding:12px 22px 20px}
.mobile-menu.open{transform:none}
.mobile-menu a{display:block;padding:14px 8px;color:rgba(255,255,255,.8);font-size:16px;border-bottom:1px solid var(--hair)}
.mobile-menu .btn{width:100%;justify-content:center;margin-top:14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:10px}
.kicker .c{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);border:1px solid rgba(41,141,255,.3);border-radius:5px;padding:3px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:rgba(255,255,255,.03);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
h1,h2,h3{letter-spacing:-.02em}
.head{max-width:640px}
.head .kicker{margin-bottom:14px}
.head h2{font-family:var(--disp);font-weight:600;font-size:clamp(26px,4vw,40px);line-height:1.1;color:#fff}
.head p{margin-top:14px;color:rgba(255,255,255,.55);font-size:clamp(15px,2vw,17px)}
.section{padding:64px 0;border-top:1px solid var(--hair)}
.section.first{border-top:none}
.phero{position:relative;padding:120px 0 48px;border-bottom:1px solid var(--hair)}
.phero::before{content:"";position:absolute;left:0;top:96px;width:48px;height:3px;background:var(--blue)}
.phero h1{font-family:var(--disp);font-weight:600;font-size:clamp(34px,6vw,58px);line-height:1.05;color:#fff;margin-top:22px;max-width:780px}
.phero p{margin-top:18px;max-width:620px;font-size:clamp(16px,2vw,18px);color:rgba(255,255,255,.55)}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
.card{position:relative;border:1px solid var(--hair);border-radius:14px;background:var(--card);padding:24px;transition:border-color .25s,background .25s,transform .25s}
.card.hover:hover{border-color:var(--hairlit);transform:translateY(-2px)}
.spot{position:relative}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .35s;pointer-events:none;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(41,141,255,.1),transparent 70%)}
.spot:hover::before{opacity:1}
.card>*{position:relative;z-index:1}
.num{font-family:var(--disp);font-weight:600;color:#fff;line-height:1}
.lead{display:grid;grid-template-columns:1.15fr .85fr;gap:0;overflow:hidden;border:1px solid var(--hair);border-radius:16px;background:var(--card)}
.lead .media{position:relative;min-height:340px;overflow:hidden}
.lead .body{padding:36px;display:flex;flex-direction:column;justify-content:center}
.lead h2{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.4vw,38px);line-height:1.12;letter-spacing:-.01em;color:#fff;margin-top:16px}
.lead p{margin-top:14px;color:rgba(255,255,255,.55);font-size:15px}
.side{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:var(--card)}
.side a{padding:20px 22px;border-bottom:1px solid var(--hair);transition:background .2s}
.side a:last-child{border-bottom:none}
.side a:hover{background:rgba(255,255,255,.03)}
.side h4{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.25;color:#fff;margin-top:8px}
.newscard{display:flex;flex-direction:column;height:100%;overflow:hidden;border:1px solid var(--hair);border-radius:14px;background:var(--card);transition:border-color .25s,transform .25s}
.newscard:hover{border-color:var(--hairlit);transform:translateY(-2px)}
.newscard .media{height:150px;position:relative;overflow:hidden}
.newscard .body{padding:20px;display:flex;flex-direction:column;flex:1}
.newscard h3{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.22;color:#fff;margin-top:12px}
.newscard p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.45);flex:1}
.ph-grad{background:radial-gradient(120% 120% at 20% 0%,#1b3a6b,#0d1b30 55%,#0a0d12)}
.ph-mesh{background:linear-gradient(135deg,#123,#0a1622)}
.dateline{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.4);display:flex;gap:10px;align-items:center}
.toy{border:1px solid var(--hair);border-radius:16px;background:var(--card);overflow:hidden}
.toy-head{padding:18px 24px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:12px}
.toy-body{padding:28px 24px}
.quote{font-family:var(--serif);font-size:clamp(18px,2.4vw,24px);line-height:1.4;color:#fff}
.choice{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.cbtn{flex:1;min-width:120px;border:1px solid var(--hairlit);background:rgba(255,255,255,.02);color:#fff;border-radius:10px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;transition:.2s;font-family:inherit}
.cbtn:hover{border-color:var(--blue);background:rgba(41,141,255,.08)}
.cbtn.right{border-color:#34d399;background:rgba(52,211,153,.12);color:#6ee7b7}
.cbtn.wrong{border-color:#f87171;background:rgba(248,113,113,.12);color:#fca5a5}
.genout{font-family:var(--disp);font-weight:600;font-size:clamp(20px,3vw,30px);color:#fff;line-height:1.25;min-height:2.4em;display:flex;align-items:center}
.field{width:100%;border:1px solid var(--hair);background:var(--ink);border-radius:10px;padding:12px 15px;font-size:14px;color:#fff;outline:none;transition:.2s;font-family:inherit}
.field::placeholder{color:rgba(255,255,255,.3)}
.field:focus{border-color:rgba(41,141,255,.55);background:var(--ink2)}
textarea.field{resize:vertical}
.flabel{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.chip{border:1px solid var(--hair);background:none;color:rgba(255,255,255,.6);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{border-color:var(--hairlit);color:#fff}
.chip.on{border-color:var(--blue);background:rgba(41,141,255,.14);color:var(--blue)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.idmono{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.35)}
.note{border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.05);border-radius:12px;padding:14px 16px;font-size:13px;color:rgba(253,230,138,.7);line-height:1.6}
.ok-box{border:1px solid rgba(41,141,255,.3);background:rgba(41,141,255,.07);border-radius:12px;padding:18px}
.err-box{border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.06);border-radius:10px;padding:12px 15px;color:#fca5a5;font-size:14px}
.stat-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--hair);padding:12px 0;font-size:14px}
.statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.aura{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
footer{border-top:1px solid var(--hair);margin-top:72px;padding:46px 0;background:rgba(255,255,255,.012)}
.fcol h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:14px}
.fcol a{display:block;font-size:14px;color:rgba(255,255,255,.55);padding:5px 0;cursor:pointer;transition:.2s}.fcol a:hover{color:#fff}
.soc{display:inline-flex;width:36px;height:36px;border:1px solid var(--hair);border-radius:9px;align-items:center;justify-content:center;color:rgba(255,255,255,.55);transition:.2s}.soc:hover{border-color:var(--blue);color:var(--blue)}
@keyframes novaspin{to{transform:rotate(360deg)}}
.lrot{transform-box:fill-box;transform-origin:center;animation:novaspin 22s linear infinite}
.cert-frame{border-radius:28px;padding:2px;background:linear-gradient(140deg,rgba(41,141,255,.6),rgba(255,255,255,.06) 35%,rgba(41,141,255,.25) 70%,rgba(255,255,255,.05));box-shadow:0 40px 120px -40px rgba(41,141,255,.35)}
.cert{position:relative;overflow:hidden;border-radius:26px;background:var(--ink);padding:56px 56px}
.cert .corner{position:absolute;width:24px;height:24px;border-left:1px solid rgba(41,141,255,.5);border-top:1px solid rgba(41,141,255,.5)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:900px){
.nav-links,.nav-cta .link-dim{display:none}
.burger{display:flex}
.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.span2{grid-column:span 1}
.lead{grid-template-columns:1fr}.lead .media{min-height:200px}
.cert{padding:34px 22px}
footer .grid{grid-template-columns:1fr 1fr!important;gap:28px!important}
}
@media(max-width:560px){footer .grid{grid-template-columns:1fr!important}.nav-cta>.btn{display:none}}
@media(prefers-reduced-motion:reduce){.lrot{animation:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

</defs></svg>
<header id="hdr"></header>
<div class="mobile-menu" id="mmenu"></div>
<main id="app"></main>

function bindHome(){
 let qi=0,score=0,answered=false;const qb=document.getElementById('quizbody');

  qb.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const guess=b.dataset.a==='1';const correct=guess===item[1];if(correct)score++;qb.querySelectorAll('.cbtn').forEach(x=>{const xg=x.dataset.a==='1';x.classList.add(xg===item[1]?'right':'wrong');x.disabled=true;});document.getElementById('qexpl').innerHTML='<div style="margin-top:18px;padding:14px 16px;border:1px solid var(--hair);border-radius:10px;font-size:14px;color:rgba(255,255,255,.6)"><b style="color:'+(correct?'#6ee7b7':'#fca5a5')+'">'+(correct?'Верно! ':'Мимо. ')+'</b>'+item[2]+'</div><button class="btn btn-ghost btn-sm" id="qnext" style="margin-top:16px">'+(qi<AIQUIZ.length-1?'Следующий':'Начать заново')+' '+ico('arrow')+'</button>';
   document.getElementById('qnext').onclick=()=>{qi=qi<AIQUIZ.length-1?qi+1:0;if(qi===0)score=0;drawQuiz();};});}
 if(qb)drawQuiz();
 const gb=document.getElementById('genbtn'),go=document.getElementById('genout');

function bindRegistry(){const q=document.getElementById('regq'),list=document.getElementById('reglist'),count=document.getElementById('regcount');let cat='Все';
 function pl(n){const a=n%10,b=n%100;if(a===1&&b!==11)return'резидент';if(a>=2&&a<=4&&(b<10||b>=20))return'резидента';return'резидентов';}
 function draw(){const term=(q.value||'').toLowerCase();const f=DB.residents.filter(r=>{const mq=!term||[r.project,r.tagline,r.id,r.category,r.city].join(' ').toLowerCase().includes(term);const mc=cat==='Все'||r.category.startsWith(cat);return mq&&mc;});count.textContent=f.length+' '+pl(f.length);list.innerHTML=f.length?f.map(rcard).join(''):'<div class="card" style="grid-column:1/-1;text-align:center;padding:48px;color:rgba(255,255,255,.45)">Ничего не найдено.</div>';list.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));}
 q.oninput=draw;document.querySelectorAll('#regcats .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#regcats .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');cat=c.dataset.c;draw();});draw();
}
function bindVerify(){const inp=document.getElementById('vid'),btn=document.getElementById('vbtn'),res=document.getElementById('vres');
 function check(){const id=(inp.value||'').trim();if(!id)return;const r=DB.residents.find(x=>x.id.toLowerCase()===id.toLowerCase());
  if(r)res.innerHTML='<a class="ok-box" href="#/rezident/'+r.id+'" style="display:block"><div class="badge">'+ico('check')+' Подлинность подтверждена</div><div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><div class="disp" style="font-weight:600;font-size:20px;color:#fff">'+r.project+'</div><div style="margin-top:2px;font-size:14px;color:rgba(255,255,255,.55)">'+r.tagline+'</div></div><span style="color:rgba(255,255,255,.4)">'+ico('arrow')+'</span></div><div class="idmono" style="margin-top:12px">'+r.id+' · '+r.category+'</div></a>';
  else res.innerHTML='<div class="err-box"><strong>ID не найден в реестре.</strong> Проверьте правильность — подлинный резидент всегда есть в публичном реестре Nova.</div>';}
 btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
}
function bindApply(){const zone=document.getElementById('applyzone');zone.innerHTML=applyFormHTML();let stage='MVP';
 zone.querySelectorAll('#stagechips .chip').forEach(c=>c.onclick=()=>{zone.querySelectorAll('#stagechips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');stage=c.dataset.stage;});
 document.getElementById('applybtn').onclick=()=>{const d={stage};zone.querySelectorAll('[data-f]').forEach(el=>d[el.dataset.f]=el.value.trim());
  const req=['project','tagline','category','city','founders','email','ai','description'];const miss=req.find(k=>!d[k]);const errEl=document.getElementById('applyerr');
  if(miss){errEl.innerHTML='<div class="err-box" style="margin-top:16px">Заполните все обязательные поля.</div>';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){errEl.innerHTML='<div class="err-box" style="margin-top:16px">Укажите корректный email.</div>';return;}
  d.ref='AP-'+Math.random().toString(36).slice(2,8).toUpperCase();d.createdAt=new Date().toISOString().slice(0,10);d.status='new';DB.applications.unshift(d);save();
  zone.innerHTML='<div class="card" style="text-align:center;padding:48px"><span style="margin:0 auto;width:56px;height:56px;border-radius:50%;background:rgba(41,141,255,.15);color:var(--blue);display:flex;align-items:center;justify-content:center">'+ico('check')+'</span><h2 class="disp" style="margin-top:24px;font-weight:600;font-size:28px;color:#fff">Заявка принята</h2><p style="margin:12px auto 0;max-width:420px;color:rgba(255,255,255,.55)">Экспертный совет рассмотрит проект в течение 1–5 дней. Взнос — только после признания.</p><div style="margin:24px auto 0;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--hair);border-radius:10px;padding:12px 16px"><span class="mono">Номер заявки</span><span style="font-family:var(--mono);color:#fff">'+d.ref+'</span></div><div style="margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn btn-ghost" href="#/">На главную</a><a class="btn btn-primary" href="#/admin">Открыть админку →</a></div></div>';};
}
function bindCert(){const id=location.hash.slice(1).split('/').filter(Boolean)[1];const r=DB.residents.find(x=>x.id.toLowerCase()===String(id).toLowerCase());const cv=document.getElementById('certqr');
 if(r&&cv&&window.QRCode){const url=location.origin+location.pathname+'#/rezident/'+r.id;window.QRCode.toCanvas(cv,url,{margin:0,width:120,color:{dark:'#ffffff',light:'#00000000'}},()=>{});}}
function bindAdmin(){
 if(sessionStorage.getItem('nova_admin_ok')!=='1'){const btn=document.getElementById('alogin'),inp=document.getElementById('atoken');const go=()=>{if((inp.value||'').trim()==='nova-admin'){sessionStorage.setItem('nova_admin_ok','1');router();}else document.getElementById('aerr').innerHTML='<div class="err-box" style="margin-top:12px">Неверный токен.</div>';};btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};return;}
 document.getElementById('alogout').onclick=()=>{sessionStorage.removeItem('nova_admin_ok');router();};
 document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;newsEditId=null;router();});
 document.querySelectorAll('#afilters .chip').forEach(c=>c.onclick=()=>{appFilter=c.dataset.fs;router();});
 document.querySelectorAll('[data-aact]').forEach(b=>b.onclick=()=>{const app=DB.applications.find(x=>x.ref===b.dataset.ref);if(!app)return;app.status=b.dataset.aact;if(b.dataset.aact==='recognized'&&!app.residentId){const id=nextId();app.residentId=id;const today=new Date().toISOString().slice(0,10);DB.residents.unshift({id,project:app.project,tagline:app.tagline,description:app.description,category:app.category,city:app.city,website:app.website||"",founders:app.founders,email:app.email,telegram:app.telegram||"",recognizedAt:today,expiresAt:plusYear(today)});}save();router();});
 document.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{const r=DB.residents.find(x=>x.id===b.dataset.id);if(!r)return;r.expiresAt=addTime(r.expiresAt,b.dataset.ext);save();router();});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const r=DB.residents.find(x=>x.id===b.dataset.del);if(!r)return;if(!confirm('Убрать «'+r.project+'» ('+r.id+') из реестра? Действие необратимо.'))return;DB.residents=DB.residents.filter(x=>x.id!==b.dataset.del);save();router();});
 document.querySelectorAll('[data-nedit]').forEach(b=>b.onclick=()=>{newsEditId=b.dataset.nedit;router();});
 document.querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>{const n=DB.news.find(x=>x.id===b.dataset.ndel);if(!n)return;if(!confirm('Удалить новость «'+n.title+'»?'))return;DB.news=DB.news.filter(x=>x.id!==b.dataset.ndel);save();router();});
 const ncancel=document.getElementById('nf-cancel');if(ncancel)ncancel.onclick=()=>{newsEditId=null;router();};
 const nsave=document.getElementById('nf-save');if(nsave)nsave.onclick=()=>{
  const t=document.getElementById('nf-title').value.trim(),cat=document.getElementById('nf-cat').value.trim(),date=document.getElementById('nf-date').value,exc=document.getElementById('nf-exc').value.trim(),body=document.getElementById('nf-body').value.trim();
  if(!t||!cat||!exc){document.getElementById('nf-err').innerHTML='<div class="err-box" style="margin-top:14px">Заполните заголовок, категорию и описание.</div>';return;}
  const bodyArr=body?body.split(/\n+/).filter(Boolean):[exc];
  if(newsEditId){const n=DB.news.find(x=>x.id===newsEditId);Object.assign(n,{title:t,cat,date,excerpt:exc,body:bodyArr});newsEditId=null;}
  else DB.news.unshift({id:'n'+Date.now(),title:t,cat,date,excerpt:exc,ph:Math.random()>.5?'ph-grad':'ph-mesh',body:bodyArr});
  save();router();};
}

/* ===================== GLOBAL FX + BOOT ===================== */
(function fx(){if(!matchMedia('(pointer:fine)').matches)return;const cg=document.getElementById('cglow');
 addEventListener('pointermove',e=>{cg.style.opacity='1';cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';const card=e.target.closest&&e.target.closest('.spot');if(card){const r=card.getBoundingClientRect();card.style.setProperty('--mx',(e.clientX-r.left)+'px');card.style.setProperty('--my',(e.clientY-r.top)+'px');}});
 document.addEventListener('pointerleave',()=>cg.style.opacity='0');})();
addEventListener('scroll',()=>document.getElementById('hdr').classList.toggle('scrolled',scrollY>8));
addEventListener('hashchange',router);
renderShell();if(!location.hash)location.hash='#/';router();
</script>
</body>
</html>
