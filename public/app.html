<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nova Scout — кликабельный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--blue:#298DFF;--blue-l:#5aa6ff;--ink:#0a0b0e;--ink2:#0e1014;--hair:rgba(255,255,255,.08);--hairlit:rgba(255,255,255,.16);
--sans:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{background:#000;color:#e8eaee;font-family:var(--sans);overflow-x:hidden;line-height:1.5}
::selection{background:var(--blue);color:#fff}
a{color:inherit;text-decoration:none}
canvas,img,svg{display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:3px 3px;opacity:.5}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:rgba(255,255,255,.42)}
.disp{font-family:var(--disp);letter-spacing:-.02em}
.cursor-glow{position:fixed;width:540px;height:540px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(41,141,255,.14),transparent 60%);transform:translate(-50%,-50%);transition:opacity .4s;opacity:0;mix-blend-mode:screen}
/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:40;transition:.3s}
header.scrolled{background:rgba(0,0,0,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:#fff}
.logo .mark{width:30px;height:30px;overflow:visible}
.logo .dim{color:rgba(255,255,255,.55)}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:8px 13px;border-radius:99px;font-size:14px;color:rgba(255,255,255,.55);transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-cta{display:flex;align-items:center;gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:11px 20px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:transform .15s,box-shadow .25s,background .2s;position:relative;overflow:hidden;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 0 0 1px rgba(41,141,255,.4),0 8px 30px -8px rgba(41,141,255,.6)}
.btn-primary:hover{background:var(--blue-l)}
.btn-primary::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);transition:left .6s}
.btn-primary:hover::after{left:140%}
.btn-ghost{background:rgba(255,255,255,.03);color:#fff;border:1px solid var(--hairlit)}
.btn-ghost:hover{background:rgba(255,255,255,.07)}
.btn-white{background:#fff;color:#000}.btn-white:hover{background:rgba(255,255,255,.9)}
.btn-danger{background:none;border:1px solid rgba(248,113,113,.3);color:#fca5a5}.btn-danger:hover{background:rgba(248,113,113,.1)}
.btn-sm{padding:8px 14px;font-size:13px}
.link-dim{font-size:14px;color:rgba(255,255,255,.55);transition:.2s;cursor:pointer}.link-dim:hover{color:#fff}
.burger{display:none;width:40px;height:40px;border:1px solid var(--hair);border-radius:10px;background:none;cursor:pointer;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:2px;background:#fff;transition:.25s}
.mobile-menu{position:fixed;inset:64px 0 auto 0;z-index:39;background:rgba(0,0,0,.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);transform:translateY(-130%);transition:transform .35s cubic-bezier(.16,1,.3,1);padding:12px 20px 20px}
.mobile-menu.open{transform:none}
.mobile-menu a{display:block;padding:14px 8px;color:rgba(255,255,255,.8);font-size:16px;border-bottom:1px solid var(--hair)}
.mobile-menu .btn{width:100%;justify-content:center;margin-top:14px}
/* aurora + particles */
.hero{position:relative;overflow:hidden}
.aura{position:absolute;border-radius:50%;filter:blur(90px);opacity:.8;will-change:transform;pointer-events:none}
.a1{width:62vw;height:62vw;left:50%;bottom:-25vw;transform:translateX(-50%);background:radial-gradient(circle,#298DFF,#1b5fb0 45%,transparent 70%);animation:floatA 16s ease-in-out infinite}
.a2{width:40vw;height:40vw;left:8%;top:16%;background:radial-gradient(circle,#1f73d6,transparent 65%);animation:floatB 20s ease-in-out infinite}
.a3{width:36vw;height:36vw;right:5%;top:28%;background:radial-gradient(circle,#3a7bd5,transparent 65%);animation:floatC 24s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-46%) scale(1.12)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-8%) scale(1.15)}}
@keyframes floatC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.1)}}
.hero-canvas{position:absolute;inset:0;z-index:1;opacity:.7;pointer-events:none}
.hero-veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 30%,transparent 60%,#000)}
/* headings */
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:rgba(255,255,255,.03);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 3s infinite}
@keyframes pulse{0%,100%{opacity:.4;box-shadow:0 0 0 0 rgba(41,141,255,.5)}50%{opacity:1;box-shadow:0 0 0 6px rgba(41,141,255,0)}}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.shine{background:linear-gradient(110deg,#fff 20%,#9cc6ff 40%,#fff 60%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shineMove 5s linear infinite}
.gtext{background:linear-gradient(180deg,#fff 30%,#9cc6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes shineMove{to{background-position:200% center}}
.head{max-width:640px}
.head h2{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.5vw,46px);line-height:1.08;letter-spacing:-.02em;color:#fff;margin-top:18px}
.head p{margin-top:16px;color:rgba(255,255,255,.55);font-size:clamp(15px,2vw,18px)}
.section-pad{padding:80px 0}
/* page hero */
.phero{position:relative;overflow:hidden;border-bottom:1px solid var(--hair);padding:130px 0 70px}
.phero .glow{position:absolute;inset-inline:0;top:-160px;height:320px;background:radial-gradient(60% 100% at 50% 0%,rgba(41,141,255,.18),transparent 70%);pointer-events:none}
.phero h1{font-family:var(--disp);font-weight:600;font-size:clamp(36px,7vw,68px);line-height:1.04;letter-spacing:-.03em;color:#fff;margin-top:24px;max-width:760px;position:relative;z-index:3}
.phero p{margin-top:20px;max-width:620px;font-size:clamp(16px,2vw,19px);color:rgba(255,255,255,.55);position:relative;z-index:3}
.phero .eyebrow{position:relative;z-index:3}
/* bento */
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}.cols-5{grid-template-columns:repeat(5,1fr)}
.span2{grid-column:span 2}
.bento{position:relative;overflow:hidden;border:1px solid var(--hair);border-radius:18px;background:var(--ink);background-image:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%);padding:26px;transition:border-color .3s,background .3s,transform .3s}
.bento.hover:hover{border-color:var(--hairlit);background-color:var(--ink2);transform:translateY(-3px)}
.spot{position:relative}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .35s;pointer-events:none;z-index:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(41,141,255,.16),transparent 70%)}
.spot:hover::before{opacity:1}
.bento>*{position:relative;z-index:1}
.num{font-family:var(--disp);font-weight:600;letter-spacing:-.02em;color:#fff;line-height:1}
.ic{width:48px;height:48px;border-radius:12px;border:1px solid var(--hair);background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);display:flex;align-items:center;justify-content:center}
.ic svg{width:26px;height:26px}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#175aa8);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;color:#fff}
/* reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
/* marquee */
.marquee{overflow:hidden;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:22px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mtrack{display:flex;width:max-content;animation:scrollX 32s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mtrack span{font-family:var(--disp);font-weight:500;font-size:20px;color:rgba(255,255,255,.4);white-space:nowrap;display:inline-flex;align-items:center;gap:48px;padding-right:48px}
.mtrack span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);opacity:.6}
@keyframes scrollX{to{transform:translateX(-50%)}}
/* logo spin */
@keyframes novaspin{to{transform:rotate(360deg)}}
.lrot-slow{transform-box:fill-box;transform-origin:center;animation:novaspin 16s linear infinite}
.lrot-fast{transform-box:view-box;transform-origin:20px 20px;animation:novaspin 7s linear infinite}
/* forms */
.field{width:100%;border:1px solid var(--hair);background:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px;color:#fff;outline:none;transition:.2s;font-family:inherit}
.field::placeholder{color:rgba(255,255,255,.3)}
.field:focus{border-color:rgba(41,141,255,.6);background:var(--ink2);box-shadow:0 0 0 3px rgba(41,141,255,.12)}
textarea.field{resize:vertical}
.flabel{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.chip{border:1px solid var(--hair);background:none;color:rgba(255,255,255,.55);border-radius:99px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{border-color:var(--hairlit);color:#fff}
.chip.on{border-color:var(--blue);background:rgba(41,141,255,.15);color:var(--blue)}
/* misc */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.idmono{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.35)}
.note{border:1px solid rgba(245,158,11,.2);background:rgba(245,158,11,.05);border-radius:12px;padding:14px 16px;font-size:13px;color:rgba(253,230,138,.7);line-height:1.6}
.ok-box{border:1px solid rgba(41,141,255,.3);background:rgba(41,141,255,.07);border-radius:14px;padding:18px}
.err-box{border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.06);border-radius:12px;padding:12px 16px;color:#fca5a5;font-size:14px}
.divider{height:1px;background:var(--hair);margin:16px 0}
/* footer */
footer{border-top:1px solid var(--hair);margin-top:80px;padding:48px 0}
.fcol h4{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:14px}
.fcol a{display:block;font-size:14px;color:rgba(255,255,255,.55);padding:5px 0;cursor:pointer;transition:.2s}.fcol a:hover{color:#fff}
.soc{display:inline-flex;width:36px;height:36px;border:1px solid var(--hair);border-radius:10px;align-items:center;justify-content:center;color:rgba(255,255,255,.55);transition:.2s}.soc:hover{border-color:var(--blue);color:var(--blue)}
/* certificate */
.cert-frame{border-radius:28px;padding:2px;background:linear-gradient(140deg,rgba(41,141,255,.6),rgba(255,255,255,.06) 35%,rgba(41,141,255,.25) 70%,rgba(255,255,255,.05));box-shadow:0 40px 120px -40px rgba(41,141,255,.35)}
.cert{position:relative;overflow:hidden;border-radius:26px;background:var(--ink);padding:56px 56px}
.cert .corner{position:absolute;width:24px;height:24px;border-left:1px solid rgba(41,141,255,.5);border-top:1px solid rgba(41,141,255,.5)}
/* responsive */
@media(max-width:900px){
.nav-links,.nav-cta .link-dim,.nav-cta>.btn{display:none}
.burger{display:flex}
.cols-4,.cols-5{grid-template-columns:1fr 1fr}.cols-3,.cols-2{grid-template-columns:1fr}.span2{grid-column:span 1}
.cert{padding:36px 24px}
footer .grid{grid-template-columns:1fr 1fr!important;gap:28px!important}
}
@media(max-width:560px){.cols-4,.cols-5{grid-template-columns:1fr}footer .grid{grid-template-columns:1fr!important}}
@media(prefers-reduced-motion:reduce){.aura,.mtrack,.shine,.lrot-slow,.lrot-fast{animation:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<linearGradient id="nova-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7db4ff"/><stop offset=".55" stop-color="#298DFF"/><stop offset="1" stop-color="#175aa8"/></linearGradient>
<radialGradient id="nova-core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#cfe4ff"/><stop offset="1" stop-color="#298DFF"/></radialGradient>
<linearGradient id="gi-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7db4ff"/><stop offset="1" stop-color="#298DFF"/></linearGradient>
<linearGradient id="gi-stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9cdff"/><stop offset="1" stop-color="#4a98ff"/></linearGradient>
</defs></svg>

<header id="hdr"></header>
<div class="mobile-menu" id="mmenu"></div>
<main id="app"></main>

let pfClean=null;
function afterRender(){

function initReveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=((i%4)*70)+'ms';io.observe(el)});}
function initCount(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,to=+el.dataset.count,suf=el.dataset.suf||'';let t0=null;const step=t=>{if(!t0)t0=t;const p=Math.min((t-t0)/1100,1),ease=1-Math.pow(1-p,3);el.textContent=Math.round(to*ease)+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}),{threshold:.5});document.querySelectorAll('[data-count]').forEach(el=>io.observe(el));}
function initParticles(){
 if(pfClean){pfClean();pfClean=null;}
 const cv=document.querySelector('.hero-canvas');if(!cv)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const ctx=cv.getContext('2d');let w,h,dpr,pts,raf,mx=-9999,my=-9999;
 function size(){dpr=Math.min(devicePixelRatio||1,2);const par=cv.parentElement;w=cv.width=innerWidth*dpr;h=cv.height=(par?par.offsetHeight:innerHeight)*dpr;cv.style.width='100%';cv.style.height='100%';const n=innerWidth<700?30:62;pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25*dpr,vy:(Math.random()-.5)*.25*dpr,r:(Math.random()*1.6+.5)*dpr}));}
 size();const onR=()=>size();const onM=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*dpr;my=(e.clientY-r.top)*dpr;};
 addEventListener('resize',onR);addEventListener('pointermove',onM);const L=120;
 function loop(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const dm=Math.hypot(p.x-mx,p.y-my);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=dm<L*dpr?'rgba(120,180,255,.9)':'rgba(150,180,230,.4)';ctx.fill();}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<L*dpr){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(41,141,255,'+(.16*(1-d/(L*dpr)))+')';ctx.lineWidth=dpr;ctx.stroke();}}raf=requestAnimationFrame(loop);}
 loop();pfClean=()=>{cancelAnimationFrame(raf);removeEventListener('resize',onR);removeEventListener('pointermove',onM);};
}
function initDRings(){document.querySelectorAll('.dring').forEach(cv=>{const ctx=cv.getContext('2d');const S=cv.width;let a=0;const red=matchMedia('(prefers-reduced-motion: reduce)').matches;function d(){ctx.clearRect(0,0,S,S);ctx.save();ctx.translate(S/2,S/2);ctx.rotate(a);const R0=S*0.22,R1=S*0.46;for(let r=R0;r<R1;r+=S*0.06){for(let t=0;t<Math.PI*2;t+=.12){ctx.beginPath();ctx.arc(Math.cos(t)*r,Math.sin(t)*r,1.3,0,7);ctx.fillStyle='rgba(90,166,255,'+(.25+.55*((r-R0)/(R1-R0)))+')';ctx.fill();}}ctx.restore();a+=.006;if(!red)requestAnimationFrame(d);}d();});}

function bindRegistry(){
 const q=document.getElementById('regq'),list=document.getElementById('reglist'),count=document.getElementById('regcount');let cat='Все';
 function plural(n){const a=n%10,b=n%100;if(a===1&&b!==11)return'резидент';if(a>=2&&a<=4&&(b<10||b>=20))return'резидента';return'резидентов';}
 function draw(){const term=(q.value||'').toLowerCase();const f=DB.residents.filter(r=>{const mq=!term||[r.project,r.tagline,r.id,r.category,r.city].join(' ').toLowerCase().includes(term);const mc=cat==='Все'||r.category.startsWith(cat);return mq&&mc;});count.textContent=f.length+' '+plural(f.length);list.innerHTML=f.length?f.map(rcard).join(''):'<div class="bento" style="grid-column:1/-1;text-align:center;padding:48px;color:rgba(255,255,255,.45)">Ничего не найдено.</div>';list.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));}
 q.oninput=draw;document.querySelectorAll('#regcats .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#regcats .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');cat=c.dataset.c;draw();});draw();
}
function bindVerify(){
 const inp=document.getElementById('vid'),btn=document.getElementById('vbtn'),res=document.getElementById('vres');
 function check(){const id=(inp.value||'').trim();if(!id)return;const r=DB.residents.find(x=>x.id.toLowerCase()===id.toLowerCase());
  if(r){res.innerHTML='<a class="ok-box" href="#/rezident/'+r.id+'" style="display:block"><div class="badge">'+ico('check')+' Подлинность подтверждена</div><div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><div class="disp" style="font-weight:600;font-size:20px;color:#fff">'+r.project+'</div><div style="margin-top:2px;font-size:14px;color:rgba(255,255,255,.55)">'+r.tagline+'</div></div><span style="color:rgba(255,255,255,.4)">'+ico('arrow')+'</span></div><div class="idmono" style="margin-top:12px">'+r.id+' · '+r.category+'</div></a>';}
  else{res.innerHTML='<div class="err-box"><strong>ID не найден в реестре.</strong> Проверьте правильность ID — подлинный резидент всегда есть в публичном реестре Nova.</div>';}}
 btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
}
function bindApply(){
 const zone=document.getElementById('applyzone');zone.innerHTML=applyFormHTML();
 let stage='MVP';
 zone.querySelectorAll('#stagechips .chip').forEach(c=>c.onclick=()=>{zone.querySelectorAll('#stagechips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');stage=c.dataset.stage;});
 document.getElementById('applybtn').onclick=()=>{
  const d={stage};zone.querySelectorAll('[data-f]').forEach(el=>d[el.dataset.f]=el.value.trim());
  const req=['project','tagline','category','city','founders','email','ai','description'];
  const miss=req.find(k=>!d[k]);const errEl=document.getElementById('applyerr');
  if(miss){errEl.innerHTML='<div class="err-box" style="margin-top:16px">Заполните все обязательные поля.</div>';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){errEl.innerHTML='<div class="err-box" style="margin-top:16px">Укажите корректный email.</div>';return;}
  d.ref='AP-'+Math.random().toString(36).slice(2,8).toUpperCase();d.createdAt=new Date().toISOString().slice(0,10);d.status='new';
  DB.applications.unshift(d);save();
  zone.innerHTML='<div class="bento" style="position:relative;overflow:hidden;text-align:center;padding:48px"><div class="aura a2" style="width:70%;height:70%;left:50%;top:-10%;transform:translateX(-50%);opacity:.2"></div><span style="margin:0 auto;width:56px;height:56px;border-radius:50%;background:rgba(41,141,255,.15);color:var(--blue);display:flex;align-items:center;justify-content:center">'+ico('check')+'</span><h2 class="disp" style="margin-top:24px;font-weight:600;font-size:28px;color:#fff">Заявка принята</h2><p style="margin:12px auto 0;max-width:420px;color:rgba(255,255,255,.55)">Экспертный совет рассмотрит проект в течение 1–5 дней. Членский взнос — только после признания.</p><div style="margin:24px auto 0;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--hair);background:rgba(255,255,255,.02);border-radius:12px;padding:12px 16px"><span class="mono">Номер заявки</span><span style="font-family:var(--mono);color:#fff">'+d.ref+'</span></div><div style="margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn btn-ghost" href="#/">На главную</a><a class="btn btn-primary" href="#/admin">Открыть админку →</a></div><p style="margin-top:16px;font-size:12px;color:rgba(255,255,255,.35)">Подсказка: зайдите в админку (токен nova-admin) и признайте эту заявку — проект появится в реестре с новым ID.</p></div>';
 };
}
function bindCert(){
 const parts=location.hash.slice(1).split('/').filter(Boolean);const id=parts[1];
 const r=DB.residents.find(x=>x.id.toLowerCase()===String(id).toLowerCase());const cv=document.getElementById('certqr');
 if(r&&cv&&window.QRCode){const url=location.origin+location.pathname+'#/rezident/'+r.id;window.QRCode.toCanvas(cv,url,{margin:0,width:120,color:{dark:'#ffffff',light:'#00000000'}},()=>{});}
}
function bindAdmin(){
 if(sessionStorage.getItem('nova_admin_ok')!=='1'){
  const btn=document.getElementById('alogin'),inp=document.getElementById('atoken');
  const go=()=>{if((inp.value||'').trim()==='nova-admin'){sessionStorage.setItem('nova_admin_ok','1');router();}else{document.getElementById('aerr').innerHTML='<div class="err-box" style="margin-top:12px">Неверный токен.</div>';}};
  btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};return;
 }
 document.getElementById('alogout').onclick=()=>{sessionStorage.removeItem('nova_admin_ok');router();};
 let filter='all';
 document.querySelectorAll('#afilters .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#afilters .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.fs;applyFilter();});
 function applyFilter(){document.querySelectorAll('#alist [data-app]').forEach(el=>{const a=DB.applications.find(x=>x.ref===el.dataset.app);el.style.display=(filter==='all'||a.status===filter)?'':'none';});}
 document.querySelectorAll('#alist [data-act]').forEach(b=>b.onclick=()=>{
  const ref=b.dataset.ref,act=b.dataset.act,app=DB.applications.find(x=>x.ref===ref);if(!app)return;
  app.status=act;
  if(act==='recognized'&&!app.residentId){const id=nextId();app.residentId=id;DB.residents.unshift({id,project:app.project,tagline:app.tagline,description:app.description,category:app.category,city:app.city,website:app.website||"",founders:app.founders,recognizedAt:new Date().toISOString().slice(0,10)});}
  save();router();
 });
}

/* ===================== GLOBAL FX + BOOT ===================== */
(function fx(){
 const fine=matchMedia('(pointer:fine)').matches;if(!fine)return;
 const cg=document.getElementById('cglow');
 addEventListener('pointermove',e=>{cg.style.opacity='1';cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';const card=e.target.closest&&e.target.closest('.spot');if(card){const r=card.getBoundingClientRect();card.style.setProperty('--mx',(e.clientX-r.left)+'px');card.style.setProperty('--my',(e.clientY-r.top)+'px');}});
 document.addEventListener('pointerleave',()=>cg.style.opacity='0');
})();
addEventListener('scroll',()=>document.getElementById('hdr').classList.toggle('scrolled',scrollY>8));
addEventListener('hashchange',router);
renderShell();
if(!location.hash)location.hash='#/';
router();
</script>
